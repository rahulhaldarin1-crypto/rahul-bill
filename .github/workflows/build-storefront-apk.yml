name: Build GG SHOPPING Android APK

on:
  workflow_dispatch:

jobs:
  build-gg-shopping-apk:
    name: Build GG SHOPPING Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build GG SHOPPING web bundle
        env:
          APP_MODE: storefront
          VITE_APP_MODE: storefront
        run: npm run build

      - name: Clean old android folder and add Capacitor Android
        run: |
          rm -rf android
          npx cap add android

      - name: Set GG SHOPPING app ID, name, and launcher icon
        run: |
          node -e '
            const fs = require("fs");
            const newId = "com.glamourgalleria.shopping";

            const cfgPath = "capacitor.config.ts";
            if (fs.existsSync(cfgPath)) {
              let content = fs.readFileSync(cfgPath, "utf8");
              if (/appId\s*:/.test(content)) {
                content = content.replace(/appId\s*:\s*["\x27][^"\x27]*["\x27]/, `appId: "${newId}"`);
              } else {
                content = content.replace(/(\{\s*)/, `$1appId: "${newId}",\n  `);
              }
              if (/appName\s*:/.test(content)) {
                content = content.replace(/appName\s*:\s*["\x27][^"\x27]*["\x27]/, "appName: \"GG SHOPPING\"");
              } else {
                content = content.replace(/(\{\s*)/, `$1appName: "GG SHOPPING",\n  `);
              }
              content = content.replace(/url\s*:\s*["\x27][^"\x27]*["\x27]/g, "");
              fs.writeFileSync(cfgPath, content, "utf8");
            }

            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let gradle = fs.readFileSync(gradlePath, "utf8");
              gradle = gradle.replace(/applicationId\s+["\x27][^"\x27]+["\x27]/g, `applicationId "${newId}"`);
              gradle = gradle.replace(/namespace\s+["\x27][^"\x27]+["\x27]/g, `namespace "${newId}"`);
              fs.writeFileSync(gradlePath, gradle, "utf8");
            }

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              manifest = manifest.replace(/package="[^"]+"/, `package="${newId}"`);
              fs.writeFileSync(manifestPath, manifest, "utf8");
            }

            const stringsPath = "android/app/src/main/res/values/strings.xml";
            if (fs.existsSync(stringsPath)) {
              let xml = fs.readFileSync(stringsPath, "utf8");
              xml = xml.replace(/<string name="app_name">.*?<\/string>/, "<string name=\"app_name\">GG SHOPPING</string>");
              fs.writeFileSync(stringsPath, xml, "utf8");
            }
          '
          python3 - << 'EOF'
          import glob, os, shutil, subprocess

          candidates = []
          for pat in [
              "1795721722384.png",
              "*logo*.png", "*logo*.jpg", "*logo*.jpeg", "*logo*.webp",
              "public/*logo*.png", "public/*logo*.jpg", "public/*logo*.jpeg", "public/*logo*.webp",
              "*.png", "*.jpg", "*.jpeg", "*.webp",
              "public/*.png", "public/*.jpg", "public/*.jpeg", "public/*.webp",
          ]:
              for f in sorted(glob.glob(pat)):
                  if os.path.isfile(f) and "android/" not in f and f not in candidates:
                      candidates.append(f)

          if not candidates:
              raise SystemExit("No logo image file found in repository.")

          logo = candidates[0]
          print("Using logo file:", logo)

          if not shutil.which("convert"):
              subprocess.run(
                  "sudo apt-get update && sudo apt-get install -y imagemagick",
                  shell=True,
                  check=True,
              )

          anydpi_dir = "android/app/src/main/res/mipmap-anydpi-v26"
          if os.path.isdir(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  subprocess.run(
                      ["convert", logo, "-background", "none", "-gravity", "center", "-resize", f"{px}x{px}!", f"{out_dir}/{name}"],
                      check=True,
                  )
          EOF
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GG SHOPPING APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-shopping-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
