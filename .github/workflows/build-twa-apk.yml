name: Build GG SHOPPING TWA APK

on:
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          mkdir -p twa-app
          cd twa-app
          yes | bubblewrap init --manifest=https://glamour-galleria.vercel.app/manifest.json || true

      - name: Set package ID and app name in twa-manifest.json
        run: |
          node -e '
            const fs = require("fs");
            const path = "twa-app/twa-manifest.json";
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, "utf8"));
              data.packageId = "com.glamourgalleria.shopping";
              data.name = "GG SHOPPING";
              data.launcherName = "GG SHOPPING";
              fs.writeFileSync(path, JSON.stringify(data, null, 2));
            }
          '

      - name: Build TWA APK
        run: |
          cd twa-app
          bubblewrap build --skipPwaValidation

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-shopping-twa-apk
          path: twa-app/app-release-signed.apk
          if-no-files-found: error
