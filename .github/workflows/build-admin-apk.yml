name: Build GG Admin Panel Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build GG Admin Panel web bundle
        env:
          APP_MODE: admin
          VITE_APP_MODE: admin
        run: npm run build

      - name: Add and sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply uploaded logo as Android launcher icon
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess

          logo = "1795721722384.png"
          if not os.path.exists(logo):
              raise SystemExit(f"Logo not found: {logo}")

          if not shutil.which("convert"):
              subprocess.run(
                  "sudo apt-get update && sudo apt-get install -y imagemagick",
                  shell=True,
                  check=True,
              )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  subprocess.run(
                      ["convert", logo, "-resize", f"{px}x{px}!", f"{out_dir}/{name}"],
                      check=True,
                  )
          EOF

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GG Admin Panel APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-admin-panel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
